services:

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=public
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --certificatesresolvers.myresolver.acme.httpchallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=http
      - --certificatesresolvers.myresolver.acme.email=mark.bulthuis@mbsoftware.nl
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --entrypoints.http.http.redirections.entryPoint.to=https
      - --entrypoints.http.http.redirections.entryPoint.scheme=https
      # Access log naar stdout → promtail → Loki (headers worden standaard niet gelogd)
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      public:
        aliases:
          - "sso.${PRIVATESCAN_BASE_DOMAIN}"
          - "newcrm.${PRIVATESCAN_BASE_DOMAIN}"
          - "patient.${PRIVATESCAN_BASE_DOMAIN}"
          - "clinic.${PRIVATESCAN_BASE_DOMAIN}"
          - "chat.${PRIVATESCAN_BASE_DOMAIN}"

  crm:
    image: ghcr.io/privatescanbv/krayin-laravel-crm/krayincrm:latest
    container_name: crm
    restart: unless-stopped
    stdin_open: true
    tty: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm.rule=Host("newcrm.${PRIVATESCAN_BASE_DOMAIN}") && !PathPrefix("/llm") && !PathPrefix("/llm-fast") && !PathPrefix("/chat")
      - traefik.http.routers.crm.entrypoints=https
      - traefik.http.routers.crm.tls=true
      - traefik.http.routers.crm.tls.certresolver=myresolver
      - traefik.http.routers.crm.service=crm-svc
      - traefik.http.routers.crm.priority=1
      # === APIDOCS ROUTER (afgeschermd) ===
      - traefik.http.routers.crm-apidocs.rule=Host("newcrm.${PRIVATESCAN_BASE_DOMAIN}") && PathPrefix("/admin/apidocs")
      - traefik.http.routers.crm-apidocs.entrypoints=https
      - traefik.http.routers.crm-apidocs.tls=true
      - traefik.http.routers.crm-apidocs.priority=100
      - traefik.http.routers.crm-apidocs.service=crm-svc
      - traefik.http.middlewares.crm-apidocs-whitelist.ipallowlist.sourcerange=${ADMIN_WHITELIST}
      - traefik.http.routers.crm-apidocs.middlewares=crm-apidocs-whitelist@docker,crm-apidocs-auth
      # === BASIC AUTH MIDDLEWARE ===
      - traefik.http.middlewares.crm-apidocs-auth.basicauth.users=${CRM_APIDOCS_AUTH}
      - traefik.http.services.crm-svc.loadbalancer.server.port=80
      # Middleware: expliciete headers doorgeven
      - traefik.http.middlewares.crm-forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.crm-forward-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.crm-forward-headers.headers.customrequestheaders.X-Forwarded-Host=newcrm.${PRIVATESCAN_BASE_DOMAIN}
      - traefik.docker.network=public
      - logging=promtail
    volumes:
      - '/home/mbulthuis/upload:/usr/share/nginx/html/upload_sugarcrm'
      - '/home/apps/storage/crm:/usr/share/nginx/html/storage/app'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - backend
      - public

  # Health API (contract v1): Docker-healthchecks gebruiken alleen /health/live (observatie, geen herstart).
  # /health/ready is alleen intern bereikbaar (geen proxy-headers); /health/report vereist een bearer-token
  # (.env: HEALTH_REPORT_TOKEN voor alles).
  # Meldt of crm zijn MySQL (native op de host, via host.docker.internal) kan bereiken.
  # Bewust een aparte container: de healthcheck van crm zelf blijft /health/live. Anders zou een
  # MySQL-storing crm unhealthy maken en haalt Traefik de route én de crm-whitelist uit de routing.
  # Zichtbaar met `docker ps` / `docker compose ps`; geen Traefik-labels, dus geen effect op routing.
  crm-db-check:
    image: curlimages/curl:8.10.1
    container_name: crm-db-check
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://crm/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
    networks:
      - backend
    depends_on:
      crm:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_USER: '${PHPMYADMIN_DB_USER}'
      PMA_PASSWORD: '${PHPMYADMIN_DB_PASSWORD}'
      UPLOAD_LIMIT: 300M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host("phpmyadmin.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.pma.entrypoints=https
      - traefik.http.routers.pma.tls=true
      - traefik.http.routers.pma.tls.certresolver=myresolver
      - traefik.http.routers.pma.middlewares=pma-auth
      - traefik.http.middlewares.pma-auth.basicauth.users=admin:$$2y$$05$$13501WAPEwnZGYkGbsZ.duBZGb.C9wQYQiAqeIZM8SyAqTuAVd7Xe
      - traefik.http.services.pma.loadbalancer.server.port=80
      - traefik.docker.network=public
      - logging=promtail
    networks:
      - backend
      - public
    extra_hosts:
      - "host.docker.internal:host-gateway"

  forms:
    image: ghcr.io/privatescanbv/privateforms/forms:latest
    container_name: forms
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env.forms
    environment:
      # Gedeeld met de CRM-.env; overige variabelen staan in .env.forms
      KEYCLOAK_BASE_URL: "https://sso.${PRIVATESCAN_BASE_DOMAIN}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_REALM_PUBLIC_KEY: "${KEYCLOAK_REALM_PUBLIC_KEY}"
      CRM_API_KEY: "${API_KEY_1}"
      CRM_API_URL: "http://crm/api/"
      APP_URL: "${PATIENT_PORTAL_URL}"
      ASSET_URL: "${PATIENT_PORTAL_URL}"
      KEYCLOAK_CLIENT_SECRET: "${PATIENT_PORTAL_KEYCLOAK_CLIENT_SECRET}"
      HEALTH_REPORT_TOKEN: "${HEALTH_REPORT_TOKEN}"
      API_KEY_1: "${FORMS_API_KEY}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      # Patient portal router
      - traefik.http.routers.patient.rule=Host("patient.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.patient.entrypoints=https
      - traefik.http.routers.patient.tls=true
      - traefik.http.routers.patient.tls.certresolver=myresolver
      - traefik.http.routers.patient.service=patient-svc

      # === APIDOCS ROUTER (afgeschermd) ===
      - traefik.http.routers.patient-apidocs.rule=Host("patient.${PRIVATESCAN_BASE_DOMAIN}") && PathPrefix("/apidocs")
      - traefik.http.routers.patient-apidocs.entrypoints=https
      - traefik.http.routers.patient-apidocs.tls=true
      - traefik.http.routers.patient-apidocs.priority=100
      - traefik.http.routers.patient-apidocs.service=patient-svc
      # Eigen allowlist: niet afhankelijk van de crm-container
      - traefik.http.middlewares.patient-apidocs-whitelist.ipallowlist.sourcerange=${ADMIN_WHITELIST}
      - traefik.http.routers.patient-apidocs.middlewares=patient-apidocs-whitelist@docker,patient-apidocs-auth
      # === BASIC AUTH MIDDLEWARE ===
      - traefik.http.middlewares.patient-apidocs-auth.basicauth.users=${CRM_APIDOCS_AUTH}
      - traefik.http.services.patient-svc.loadbalancer.server.port=80
      # Middlewares
      - traefik.http.middlewares.patient-forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.patient-forward-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.patient-forward-headers.headers.customrequestheaders.X-Forwarded-Host=patient.${PRIVATESCAN_BASE_DOMAIN}
      - traefik.docker.network=public
      - logging=promtail
    volumes:
      - '/home/apps/storage/forms:/usr/share/nginx/html/storage/app'
    networks:
      - backend
      - public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      crm:
        condition: service_started

  clinic-portal:
    image: ghcr.io/privatescanbv/clinic-portal/clinic-portal:latest
    container_name: clinic-portal
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env.clinic
    environment:
      # Gedeeld met de CRM-.env; overige variabelen staan in .env.clinic
      KEYCLOAK_BASE_URL: "https://sso.${PRIVATESCAN_BASE_DOMAIN}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      CRM_API_KEY: "${API_KEY_1}"
      CRM_API_URL: "http://crm/api/"
      APP_URL: "${CLINIC_PORTAL_URL}"
      ASSET_URL: "${CLINIC_PORTAL_URL}"
      KEYCLOAK_CALLBACK_URL: "${CLINIC_PORTAL_URL}/auth/callback"
      KEYCLOAK_CLIENT_SECRET: "${CLINIC_PORTAL_KEYCLOAK_CLIENT_SECRET}"
      HEALTH_REPORT_TOKEN: "${HEALTH_REPORT_TOKEN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.clinic.rule=Host("clinic.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.clinic.entrypoints=https
      - traefik.http.routers.clinic.tls=true
      - traefik.http.routers.clinic.tls.certresolver=myresolver
      - traefik.http.routers.clinic.service=clinic-svc
      - traefik.http.routers.clinic.middlewares=clinic-forward-headers
      - traefik.http.services.clinic-svc.loadbalancer.server.port=80
      - traefik.http.middlewares.clinic-forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.clinic-forward-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.clinic-forward-headers.headers.customrequestheaders.X-Forwarded-Host=clinic.${PRIVATESCAN_BASE_DOMAIN}
      - traefik.docker.network=public
      - logging=promtail
    volumes:
      - '/home/apps/storage/clinic:/usr/share/nginx/html/storage/app'
    networks:
      - backend
      - public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      crm:
        condition: service_started

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - /home/apps/docker/loki/:/etc/loki/:ro
    networks:
      - backend
    labels:
      - logging=promtail

  promtail:
    image: grafana/promtail:3.5.8
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/apps/docker/promtail/:/etc/promtail/:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=https://logs.${PRIVATESCAN_BASE_DOMAIN}
      - GF_SERVER_DOMAIN=logs.${PRIVATESCAN_BASE_DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - backend
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host("logs.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.grafana.entrypoints=https
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=myresolver
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.docker.network=public
      - logging=promtail
    depends_on:
      - loki

  metabase:
    image: metabase/metabase:v0.63.x
    container_name: metabase
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      JAVA_TIMEZONE: Europe/Amsterdam
      # Metabase metadata DB
      MB_DB_TYPE: ${DB_CONNECTION}
      MB_DB_DBNAME: metabase
      MB_DB_PORT: ${DB_PORT}
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: ${DB_HOST}
    labels:
      - traefik.enable=true
      - traefik.http.routers.reports.rule=Host("reports.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.reports.entrypoints=https
      - traefik.http.routers.reports.tls=true
      - traefik.http.routers.reports.tls.certresolver=myresolver
      - traefik.http.routers.reports.service=reports-svc
      - traefik.http.routers.reports.middlewares=reports-forward-headers@docker
      - traefik.http.services.reports-svc.loadbalancer.server.port=3000
      - traefik.http.middlewares.reports-forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.reports-forward-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.reports-forward-headers.headers.customrequestheaders.X-Forwarded-Host=reports.${PRIVATESCAN_BASE_DOMAIN}
      - traefik.docker.network=public
      - logging=promtail
    networks:
      - public
      - backend

  keycloak:
    image: ghcr.io/privatescanbv/krayin-laravel-crm/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    env_file:
      - .env.keycloak
    environment:
      TZ: Europe/Amsterdam
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      # KC 26 hostname-v2: schema komt uit KC_HOSTNAME zelf (vandaar https://),
      # forwarded headers van Traefik worden vertrouwd via KC_PROXY_HEADERS.
      # De oude v1-opties (KC_PROXY=edge, KC_HOSTNAME_STRICT_HTTPS) worden
      # door v2 genegeerd en gaven daardoor http:// in gegenereerde URLs.
      KC_HOSTNAME: https://sso.${PRIVATESCAN_BASE_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      FORMS_FRONTEND_URL: "https://patient.dev.privatescan.nl"
    networks:
      - backend
      - public
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host("sso.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.keycloak.entrypoints=https
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=myresolver
      - traefik.http.routers.keycloak.service=keycloak-svc
      - traefik.http.routers.keycloak.middlewares=keycloak-forward-headers@docker
      - traefik.http.services.keycloak-svc.loadbalancer.server.port=8080
      - traefik.http.middlewares.keycloak-forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.keycloak-forward-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.keycloak-forward-headers.headers.customrequestheaders.X-Forwarded-Host=sso.${PRIVATESCAN_BASE_DOMAIN}
      - traefik.docker.network=public
      - logging=promtail
    # Keycloak 26 serves health on the management port (9000); the image has no
    # curl, so probe the raw socket with bash's /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    restart: unless-stopped
    env_file:
      - .env.keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak_user} -d ${POSTGRES_DB:-keycloak}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  llama:
    image: ghcr.io/ggml-org/llama.cpp@sha256:fec38a24f7b0f15bffcee5fa31532d821c5b9eb8d6c1c1e92ddf24b0cf10e239
    container_name: llama
    restart: unless-stopped
    volumes:
      - /home/apps/models:/models:ro
    environment:
      - GGML_NO_GPU=1
      - LD_LIBRARY_PATH=/app
    command: >
      -m /models/medgemma-27b-text-it-Q3_K_M.gguf
      -c 8192
      --threads 8
      --parallel 1
      --port 8080
    labels:
      - traefik.enable=true
      - traefik.docker.network=public

      # Router
      - traefik.http.routers.llm.rule=Host("newcrm.${PRIVATESCAN_BASE_DOMAIN}") && PathPrefix("/llm")
      - traefik.http.routers.llm.entrypoints=https
      - traefik.http.routers.llm.tls=true
      - traefik.http.routers.llm.tls.certresolver=myresolver
      - traefik.http.routers.llm.priority=1000

      # Service
      - traefik.http.routers.llm.service=llm-svc
      - traefik.http.services.llm-svc.loadbalancer.server.port=8080

      # Strip /llm prefix
      - traefik.http.middlewares.llm-stripprefix.stripprefix.prefixes=/llm
      - traefik.http.routers.llm.middlewares=llm-stripprefix

      # Logging
      - logging=promtail
    networks:
      - backend
      - public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  llama-fast:
    image: ghcr.io/ggml-org/llama.cpp@sha256:fec38a24f7b0f15bffcee5fa31532d821c5b9eb8d6c1c1e92ddf24b0cf10e239
    container_name: llama-fast
    restart: unless-stopped
    volumes:
      - /home/apps/models:/models:ro
    environment:
      - GGML_NO_GPU=1
      - LD_LIBRARY_PATH=/app
    command: >
      -m /models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
      -c 8192
      --threads 8
      --parallel 1
      --port 8080
      --embeddings
    labels:
      - traefik.enable=true
      - traefik.docker.network=public

      # Router
      - traefik.http.routers.llmfast.rule=Host("newcrm.${PRIVATESCAN_BASE_DOMAIN}") && PathPrefix("/llm-fast")
      - traefik.http.routers.llmfast.entrypoints=https
      - traefik.http.routers.llmfast.tls=true
      - traefik.http.routers.llmfast.tls.certresolver=myresolver
      - traefik.http.routers.llmfast.priority=1001

      # Service
      - traefik.http.routers.llmfast.service=llmfast-svc
      - traefik.http.services.llmfast-svc.loadbalancer.server.port=8080

      # Strip /llm-fast prefix
      - traefik.http.middlewares.llmfast-stripprefix.stripprefix.prefixes=/llm-fast
      - traefik.http.routers.llmfast.middlewares=llmfast-stripprefix

      # Logging
      - logging=promtail
    networks:
      - backend
      - public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  llama-qwen:
    image: ghcr.io/ggml-org/llama.cpp@sha256:fec38a24f7b0f15bffcee5fa31532d821c5b9eb8d6c1c1e92ddf24b0cf10e239
    container_name: llama-qwen
    restart: unless-stopped
    volumes:
      - /home/apps/models:/models:ro
    environment:
      - GGML_NO_GPU=1
      - LD_LIBRARY_PATH=/app
    command: >
      -m /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      --ctx-size 16384
      --threads 8
      --parallel 2
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --host 0.0.0.0
      --port 8080
      --embeddings
    labels:
      - traefik.enable=true
      - traefik.docker.network=public

      # Router
      - traefik.http.routers.llmqwen.rule=Host("newcrm.${PRIVATESCAN_BASE_DOMAIN}") && PathPrefix("/llm-qwen")
      - traefik.http.routers.llmqwen.entrypoints=https
      - traefik.http.routers.llmqwen.tls=true
      - traefik.http.routers.llmqwen.tls.certresolver=myresolver
      - traefik.http.routers.llmqwen.priority=1001

      # Service
      - traefik.http.routers.llmqwen.service=llmqwen-svc
      - traefik.http.services.llmqwen-svc.loadbalancer.server.port=8080

      # Strip /llm-qwen prefix
      - traefik.http.middlewares.llmqwen-stripprefix.stripprefix.prefixes=/llm-qwen
      - traefik.http.routers.llmqwen.middlewares=llmqwen-stripprefix

      # Logging
      - logging=promtail
    networks:
      - backend
      - public
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/models" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ai-agent:
    image: ghcr.io/privatescanbv/krayin-laravel-crm/ai-agent:latest
    container_name: ai-agent
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - .env.ai
    environment:
      DB_HOST: 'host.docker.internal'
      DB_PORT: '3306'
      DB_USER: '${DB_USERNAME}'
      DB_PASS: '${DB_PASSWORD}'
      DB_NAME: '${DB_DATABASE}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - "8001:8001"
    depends_on:
      - llama-fast
    networks:
      - public
      - backend

  ai-frontend:
    image: ghcr.io/privatescanbv/krayin-laravel-crm/ai-frontend:latest
    container_name: ai-frontend
    restart: unless-stopped
    environment:
      STREAMLIT_SERVER_COOKIE_SECRET: "${STREAMLIT_COOKIE_SECRET:-changeme-set-in-env}"
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.ai-frontend.rule=Host("chat.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.ai-frontend.entrypoints=https
      - traefik.http.routers.ai-frontend.tls=true
      - traefik.http.routers.ai-frontend.tls.certresolver=myresolver
      - traefik.http.services.ai-frontend.loadbalancer.server.port=8501
    depends_on:
      - ai-agent
    networks:
      - public
      - backend

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "MRI PACS"
      # Beveiliging
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: >-
        {"admin":"${ORTHANC_ADMIN_PASSWORD}"}
      # DICOM
      ORTHANC__DICOM_AET: "ORTHANC"
      ORTHANC__DICOM_PORT: "4242"
      # DICOMweb
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      # OHIF-webviewer
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__OHIF__DATA_SOURCE: "dicom-web"
      # Opslag
      ORTHANC__STORAGE_COMPRESSION: "true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.orthanc.rule=Host("pacs.${PRIVATESCAN_BASE_DOMAIN}")
      - traefik.http.routers.orthanc.entrypoints=https
      - traefik.http.routers.orthanc.tls=true
      - traefik.http.routers.orthanc.tls.certresolver=myresolver
      - traefik.http.routers.orthanc.service=orthanc-svc
      - traefik.http.middlewares.orthanc-whitelist.ipallowlist.sourcerange=${ADMIN_WHITELIST}
      - traefik.http.routers.orthanc.middlewares=orthanc-whitelist@docker
      - traefik.http.services.orthanc-svc.loadbalancer.server.port=8042
      - traefik.docker.network=public
      - logging=promtail
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    networks:
      - public

networks:
  backend:
    driver: bridge
  public:
    external: true

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  keycloak-db-data:
    driver: local
  orthanc-data:
    driver: local
