server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(crm|forms|n8n|mysql|traefik|suitecrm|phpmyadmin|keycloak)'
        target_label: 'app'
      - action: keep
        source_labels: ['__meta_docker_container_name']
        regex: '.+'

    pipeline_stages:
      # 1️⃣ Try Laravel's JSON log format directly against the log line.
      # docker_sd_configs reads via the Docker Engine API, which already
      # hands promtail the container's raw output line — unlike file-based
      # scraping (__path__ globbing *-json.log), there is no
      # {"log":"...","stream":...,"time":...} wrapper to unwrap first, so
      # these stages deliberately have no `source:` (they read the entry
      # itself). drop_malformed is deliberately false: with true, promtail
      # drops the WHOLE log entry (not just the field) whenever the line
      # isn't valid JSON — which is every Keycloak / MySQL / nginx line.
      # With false, non-JSON lines just leave these fields unset and fall
      # through to step 3 below, unharmed.
      - json:
          expressions:
            message: message
            context: context
            level: level
            level_name: level_name
            channel: channel
            datetime: datetime
          drop_malformed: false
      - labels:
          level_name:
          channel:
      - timestamp:
          source: datetime
          format: RFC3339Nano
      - json:
          expressions:
            context_error: error
            context_trace: trace
          source: context
          drop_malformed: false
      - labels:
          context_error:

      # 2️⃣ Handle everything step 1 didn't label (n8n, PHP, MySQL, Nginx,
      # Keycloak, ...). Gate on {level_name=""} — level_name is a real label
      # by this point (set in step 1), so the selector actually works. A
      # selector referencing an extracted-but-unlabeled field (e.g. a raw
      # `{output=~...}`) never matches anything: such a field is only ever
      # an extracted value, never promoted to a label, so the selector
      # silently compares against an always-empty label forever.
      - match:
          selector: '{level_name=""}'
          stages:
            # Pattern 1: "[INFO] message" or "[ERROR] message"
            - regex:
                expression: '^\[(?P<level_name>DEBUG|INFO|NOTICE|WARNING|WARN|ERROR|CRITICAL|ALERT|EMERGENCY|FATAL)\]\s+(?P<message>.*)'
            # Pattern 2: "ERROR message" or "WARN message" (without brackets)
            - regex:
                expression: '^(?P<level_name>DEBUG|INFO|NOTICE|WARNING|WARN|ERROR|CRITICAL|ALERT|EMERGENCY|FATAL)\s+(?P<message>.*)'
            # Pattern 3: Timestamp + level (e.g., "2024-01-01 12:00:00 INFO message")
            - regex:
                expression: '^\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}[,\.]?\d*\s+(?P<level_name>DEBUG|INFO|NOTICE|WARNING|WARN|ERROR|CRITICAL|ALERT|EMERGENCY|FATAL)\s+(?P<message>.*)'
            # Pattern 4: Default - extract entire line as message if no level found
            - regex:
                expression: '^(?P<message>.*)'
            - replace:
                expression: '^WARN$'
                source: level_name
                replace: 'WARNING'
            - replace:
                expression: '^$'
                source: level_name
                replace: 'INFO'
            # message is intentionally NOT promoted to a label here: every
            # distinct log line would become its own Loki stream (unbounded
            # cardinality). It stays queryable as line content instead.
            - labels:
                level_name:
